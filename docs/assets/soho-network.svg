<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="490" viewBox="0 0 1100 490" role="img" aria-labelledby="title desc">
  <title id="title">SOHO departmental network simulation</title>
  <desc id="desc">A Cisco 2911 router connects through a trunk to a Cisco 2960 switch, then to three departmental VLANs. Retained screenshots report a four-of-four gateway ping for each departmental PC.</desc>
  <rect width="1100" height="490" rx="18" fill="#0d2130"/>
  <text x="38" y="48" fill="#d9be7a" font-family="Arial, Helvetica, sans-serif" font-size="18" letter-spacing="2">NETWORK DESIGN · PACKET TRACER SIMULATION</text>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <rect x="400" y="78" width="300" height="64" rx="10" fill="#183e47" stroke="#a8d9d0"/>
    <text x="550" y="103" fill="#f3f5ee" font-size="20" font-weight="700">Cisco 2911 router</text>
    <text x="550" y="126" fill="#bbd1d2" font-size="15">Router-on-a-stick · /26 subnet plan</text>
    <path d="M550 142V207" stroke="#d9be7a" stroke-width="3"/>
    <text x="618" y="180" fill="#d9be7a" font-size="15">Trunk link</text>
    <rect x="400" y="207" width="300" height="64" rx="10" fill="#183e47" stroke="#a8d9d0"/>
    <text x="550" y="232" fill="#f3f5ee" font-size="20" font-weight="700">Cisco 2960 switch</text>
    <text x="550" y="255" fill="#bbd1d2" font-size="15">Three departmental VLANs</text>
    <path d="M550 271V303M210 303H890M210 303V334M550 303V334M890 303V334" fill="none" stroke="#a8d9d0" stroke-width="3"/>
    <g fill="#142e37" stroke="#a8d9d0" stroke-opacity=".6">
      <rect x="65" y="334" width="290" height="96" rx="10"/><rect x="405" y="334" width="290" height="96" rx="10"/><rect x="745" y="334" width="290" height="96" rx="10"/>
    </g>
    <g fill="#f3f5ee" font-size="20" font-weight="700"><text x="210" y="366">Departmental PC 1</text><text x="550" y="366">Departmental PC 2</text><text x="890" y="366">Departmental PC 3</text></g>
    <g fill="#a8d9d0" font-size="17"><text x="210" y="400">Gateway ping: 4 / 4</text><text x="550" y="400">Gateway ping: 4 / 4</text><text x="890" y="400">Gateway ping: 4 / 4</text></g>
  </g>
  <text x="38" y="468" fill="#bbd1d2" font-family="Arial, Helvetica, sans-serif" font-size="15">Conceptual illustration · Historical screenshot results · No real-company deployment claim</text>
</svg>
